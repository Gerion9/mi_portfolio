<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2242" />
      <stop offset="100%" stop-color="#243453" />
    </linearGradient>
    <radialGradient id="glow-indigo" cx="26%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#0F2242" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-pink" cx="78%" cy="72%" r="70%">
      <stop offset="0%" stop-color="#F24968" stop-opacity="0.26" />
      <stop offset="75%" stop-color="#0F2242" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.38" />
      <stop offset="55%" stop-color="#F24968" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#0F2242" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#F24968" stop-opacity="0.5" />
    </linearGradient>
    <radialGradient id="shine" cx="18%" cy="18%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="65%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#0A192F" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#4F46E5" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#F24968" flood-opacity="0.18" />
    </filter>
  </defs>
  <rect x="0" y="0" width="100" height="100" rx="20" fill="url(#bg)" />
  <rect x="0" y="0" width="100" height="100" rx="20" fill="url(#glow-indigo)" />
  <rect x="0" y="0" width="100" height="100" rx="20" fill="url(#glow-pink)" />
  <path d="M0 68 L68 0 H100 V32 L32 100 H0 Z" fill="url(#accent)" />
  <rect x="0" y="0" width="100" height="100" rx="20" fill="url(#shine)" />
  <rect x="1.5" y="1.5" width="97" height="97" rx="18" fill="none" stroke="url(#border)" stroke-width="2" />
